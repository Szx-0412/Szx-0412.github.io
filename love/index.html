<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>爱心</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="heartCanvas" width="840" height="680"></canvas>

<script>
/* ============ 基础参数 ============ */
const CANVAS_WIDTH  = 840;              // 画布的宽
const CANVAS_HEIGHT = 680;              // 画布的高
const CANVAS_CENTER_X = CANVAS_WIDTH / 2;   // 画布中心的 X 轴坐标
const CANVAS_CENTER_Y = CANVAS_HEIGHT / 2;  // 画布中心的 Y 轴坐标
const IMAGE_ENLARGE = 11;               // 放大比例

const HEART_COLOR = "#EEAEEE";          // 修改颜色！

/* ============ 工具函数 ============ */
const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

/* ============ 爱心函数生成器 ============ */
function heartFunction(t) {
  // 基础函数
  const x = 17 * Math.pow(Math.sin(t), 3);
  const y = -(16 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(3 * t));

  // 放大 + 移到画布中央
  return [
    Math.trunc(x * IMAGE_ENLARGE + CANVAS_CENTER_X),
    Math.trunc(y * IMAGE_ENLARGE + CANVAS_CENTER_Y)
  ];
}

/* ============ 随机内部扩散 ============ */
function scatterInside(x, y, beta = 0.15) {
  const ratioX = -beta * Math.log(Math.random() || 1e-12);
  const ratioY = -beta * Math.log(Math.random() || 1e-12);

  const dx = ratioX * (x - CANVAS_CENTER_X);
  const dy = ratioY * (y - CANVAS_CENTER_Y);

  return [x - dx, y - dy];
}

/* ============ 抖动 ============ */
function shrink(x, y, ratio) {
  const dist = Math.pow((x - CANVAS_CENTER_X) ** 2 + (y - CANVAS_CENTER_Y) ** 2, 0.6);
  const force = -1 / dist;
  const dx = ratio * force * (x - CANVAS_CENTER_X);
  const dy = ratio * force * (y - CANVAS_CENTER_Y);
  return [x - dx, y - dy];
}

/* ============ 自定义曲线函数，调整跳动周期 ============ */
function curve(p) {
  return 2 * (2 * Math.sin(4 * p)) / (2 * Math.PI);
}

/* ============ 调整缩放比例 ============ */
function calcPosition(x, y, ratio) {
  const force = 1 / Math.pow(
    (x - CANVAS_CENTER_X) ** 2 + (y - CANVAS_CENTER_Y) ** 2,
    0.420
  ); // 魔法参数
  const dx = ratio * force * (x - CANVAS_CENTER_X) + randInt(-1, 1);
  const dy = ratio * force * (y - CANVAS_CENTER_Y) + randInt(-1, 1);
  return [x - dx, y - dy];
}

/* ============ 爱心类 ============ */
class Heart {
  constructor(generateFrame = 20) {
    this.generateFrame = generateFrame;
    this.allPoints = new Array(generateFrame); // 每帧动态点坐标

    this.build(2000);

    for (let frame = 0; frame < generateFrame; frame++) {
      this.allPoints[frame] = this.calc(frame);
    }
  }

  /* 生成原始爱心坐标集合及扩散点 */
  build(number) {
    // 爱心轮廓
    const seen = new Set();
    const points = [];
    for (let i = 0; i < number; i++) {
      const t = Math.random() * 2 * Math.PI; // 随机不到的地方造成爱心有缺口
      const [x, y] = heartFunction(t);
      const key = x + ',' + y;
      if (!seen.has(key)) {
        seen.add(key);
        points.push([x, y]);
      }
    }
    this._points = points;

    // 爱心内扩散
    const edge = [];
    for (const [x, y] of points) {
      for (let i = 0; i < 3; i++) {
        edge.push(scatterInside(x, y, 0.05));
      }
    }
    this._edgeDiffusionPoints = edge;

    // 爱心内再次扩散
    const center = [];
    for (let i = 0; i < 10000; i++) {
      const p = points[randInt(0, points.length - 1)];
      center.push(scatterInside(p[0], p[1], 0.27));
    }
    this._centerDiffusionPoints = center;
  }

  /* 计算某一帧的所有点，返回扁平数组 [x, y, size, x, y, size, ...] */
  calc(frame) {
    const c = curve((frame / 10) * Math.PI);
    const ratio = 15 * c;                                   // 圆滑的周期的缩放比例
    const haloRadius = Math.trunc(4 + 6 * (1 + c));
    const haloNumber = Math.trunc(3000 + 4000 * Math.abs(c ** 2));

    const allPoints = [];

    /* ---------- 光环 ---------- */
    const haloSeen = new Set();
    for (let i = 0; i < haloNumber; i++) {
      const t = Math.random() * 2 * Math.PI;
      let [x, y] = heartFunction(t);
      [x, y] = shrink(x, y, haloRadius);

      const key = x + ',' + y;
      if (haloSeen.has(key)) continue;
      haloSeen.add(key);

      const px = Math.round(x + randInt(-60, 60));
      const py = Math.round(y + randInt(-60, 60));
      const size = [1, 1, 2][randInt(0, 2)];

      allPoints.push(px,      py,      size);
      allPoints.push(px + 20, py + 20, size);
      allPoints.push(px - 20, py - 20, size);
      allPoints.push(px + 20, py - 20, size);
      allPoints.push(px - 20, py + 20, size);
    }

    /* ---------- 轮廓 ---------- */
    for (const [px, py] of this._points) {
      const [x, y] = calcPosition(px, py, ratio);
      allPoints.push(Math.round(x), Math.round(y), randInt(1, 3));
    }

    /* ---------- 内容 ---------- */
    for (const [px, py] of this._edgeDiffusionPoints) {
      const [x, y] = calcPosition(px, py, ratio);
      allPoints.push(Math.round(x), Math.round(y), randInt(1, 2));
    }

    for (const [px, py] of this._centerDiffusionPoints) {
      const [x, y] = calcPosition(px, py, ratio);
      allPoints.push(Math.round(x), Math.round(y), randInt(1, 2));
    }

    return allPoints;
  }

  /* 渲染某一帧 */
  render(ctx, renderFrame) {
    const pts = this.allPoints[renderFrame % this.generateFrame];
    ctx.fillStyle = HEART_COLOR;
    for (let i = 0; i < pts.length; i += 3) {
      const s = pts[i + 2];
      ctx.fillRect(pts[i], pts[i + 1], s, s);
    }
  }
}

/* ============ 主程序 ============ */
const canvas = document.getElementById('heartCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

const heart = new Heart();

let renderFrame = 0;
let lastTime = 0;
const FRAME_DELAY = 50; // 每帧停留毫秒数（约 20fps，一圈 1 秒）

function draw(now) {
  requestAnimationFrame(draw);

  if (now - lastTime < FRAME_DELAY) return;
  lastTime = now;

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

  heart.render(ctx, renderFrame);
  renderFrame++;
}

requestAnimationFrame(draw);
</script>
</body>
</html>
