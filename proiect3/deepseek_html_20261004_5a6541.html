<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聊天室</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: radial-gradient(circle at 20% 20%, #2b3a55, #0f172a 70%);
  }

  .chat-app {
    width: 100%;
    max-width: 480px;
    height: min(780px, 100%);
    display: flex;
    flex-direction: column;
    background: #eef1f8;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .5);
  }

  /* ---------- 顶部 ---------- */
  .chat-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: linear-gradient(135deg, #4f8cff, #6f5cff);
    color: #fff;
    flex-shrink: 0;
  }
  .chat-header .logo {
    width: 42px; height: 42px;
    flex-shrink: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, .22);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .chat-header .info { min-width: 0; }
  .chat-header .info h1 {
    font-size: 16px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 150px;
  }
  .chat-header .info p {
    font-size: 12px; opacity: .9; margin-top: 2px;
    display: flex; align-items: center; gap: 5px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #facc15;
    transition: background .3s;
  }
  .dot.on  { background: #4ade80; animation: pulse 2s infinite; }
  .dot.off { background: #f87171; }
  @keyframes pulse {
    70%  { box-shadow: 0 0 0 7px rgba(74, 222, 128, 0); }
    100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
  }

  .header-actions { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }
  .ghost-btn {
    background: rgba(255, 255, 255, .18);
    border: none; color: #fff;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 20px;
    cursor: pointer;
    font-family: inherit;
    transition: background .2s;
    white-space: nowrap;
  }
  .ghost-btn:hover { background: rgba(255, 255, 255, .34); }

  /* ---------- 消息区 ---------- */
  .chat-body {
    flex: 1;
    overflow-y: auto;
    padding: 18px 14px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .chat-body::-webkit-scrollbar { width: 6px; }
  .chat-body::-webkit-scrollbar-thumb { background: #c6cddc; border-radius: 3px; }

  .system {
    align-self: center;
    font-size: 12px;
    color: #7b8494;
    background: rgba(255, 255, 255, .85);
    padding: 4px 12px;
    border-radius: 12px;
    text-align: center;
    max-width: 90%;
    line-height: 1.5;
  }

  .msg {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    max-width: 82%;
    animation: pop .26s cubic-bezier(.34, 1.4, .64, 1);
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(10px) scale(.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .msg.me { align-self: flex-end; flex-direction: row-reverse; }

  .msg .avatar {
    width: 34px; height: 34px;
    flex-shrink: 0;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
    color: #fff;
    user-select: none;
  }
  .msg.me .avatar { background: linear-gradient(135deg, #f7a23b, #f56b6b); }

  .msg .wrap { display: flex; flex-direction: column; min-width: 0; }
  .msg.me .wrap { align-items: flex-end; }

  .msg .name {
    font-size: 12px;
    color: #7b8494;
    padding: 0 4px 3px;
    max-width: 180px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .bubble {
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.55;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .msg.other .bubble {
    background: #fff;
    color: #1f2937;
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 3px rgba(16, 24, 40, .08);
  }
  .msg.me .bubble {
    background: linear-gradient(135deg, #4f8cff, #6f5cff);
    color: #fff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 12px rgba(79, 140, 255, .32);
  }

  .time { font-size: 11px; color: #98a2b3; padding: 2px 4px 0; }

  /* ---------- 输入区 ---------- */
  .chat-footer {
    flex-shrink: 0;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px 12px;
    background: #fff;
    border-top: 1px solid #e6e9f0;
  }
  #input {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.45;
    max-height: 108px;
    padding: 11px 14px;
    border-radius: 20px;
    background: #f1f3f9;
    color: #1f2937;
    transition: background .2s;
  }
  #input:focus { background: #e9edf7; }

  #sendBtn {
    flex-shrink: 0;
    height: 42px;
    padding: 0 20px;
    border: none;
    border-radius: 21px;
    background: linear-gradient(135deg, #4f8cff, #6f5cff);
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: transform .15s, box-shadow .2s, opacity .2s;
    box-shadow: 0 4px 14px rgba(79, 140, 255, .38);
  }
  #sendBtn:hover  { transform: translateY(-1px); }
  #sendBtn:active { transform: translateY(0) scale(.97); }
  #sendBtn:disabled {
    opacity: .45; cursor: not-allowed;
    box-shadow: none; transform: none;
  }

  /* ---------- 弹窗 ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(15, 23, 42, .78);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
    z-index: 10;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .modal {
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 340px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .4);
  }
  .modal h2 { font-size: 18px; color: #1f2937; margin-bottom: 6px; text-align: center; }
  .modal p  { font-size: 13px; color: #667085; margin-bottom: 16px; text-align: center; line-height: 1.6; }
  .modal input {
    width: 100%;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid #d0d5dd;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    margin-bottom: 12px;
  }
  .modal input:focus {
    border-color: #4f8cff;
    box-shadow: 0 0 0 3px rgba(79, 140, 255, .15);
  }
  .modal button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #4f8cff, #6f5cff);
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    margin-top: 4px;
  }
  .modal button.sec {
    background: #f1f3f9;
    color: #475467;
    margin-top: 8px;
  }
  .link-box {
    background: #f1f3f9;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12px;
    color: #475467;
    word-break: break-all;
    line-height: 1.6;
    margin-bottom: 12px;
    max-height: 90px;
    overflow-y: auto;
  }
</style>
</head>
<body>

<div class="chat-app">
  <header class="chat-header">
    <div class="logo">💬</div>
    <div class="info">
      <h1 id="roomTitle">聊天室</h1>
      <p><span class="dot" id="statusDot"></span><span id="statusText">连接中…</span></p>
    </div>
    <div class="header-actions">
      <button class="ghost-btn" id="inviteBtn">邀请</button>
      <button class="ghost-btn" id="nameBtn">昵称</button>
      <button class="ghost-btn" id="clearBtn">清屏</button>
    </div>
  </header>

  <main class="chat-body" id="chatBody"></main>

  <footer class="chat-footer">
    <textarea id="input" rows="1" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="sendBtn">发送</button>
  </footer>
</div>

<!-- 通用弹窗 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">加入聊天室</h2>
    <p id="modalDesc">设置昵称和房间名</p>
    <div id="modalBody"></div>
    <button id="modalOk">确定</button>
    <button class="sec" id="modalCancel" style="display:none">取消</button>
  </div>
</div>

<script>
/* =========================================================
   1) 动态加载 mqtt.js（主 CDN 失败自动切换备用 CDN）
   ========================================================= */
(function loadMqtt() {
  const urls = [
    'https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js',
    'https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js'
  ];
  let i = 0;
  (function next() {
    if (i >= urls.length) {
      document.getElementById('chatBody').innerHTML =
        '<div class="system">MQTT 库加载失败，请检查网络后刷新页面</div>';
      return;
    }
    const s = document.createElement('script');
    s.src = urls[i++];
    s.onload = () => window.__start && window.__start();
    s.onerror = next;
    document.head.appendChild(s);
  })();
})();

/* =========================================================
   2) 主程序
   ========================================================= */
window.__start = function () {
  'use strict';

  /* ---------------- 配置 ---------------- */
  const BROKER   = 'wss://broker.emqx.io:8084/mqtt';  // 公共 MQTT 服务（免费、免注册）
  const PREFIX   = 'ghchat/v1/';                       // 主题前缀
  const HEARTBEAT = 3000;   // 心跳间隔
  const PEER_TTL  = 9000;   // 超过这个时间没心跳就判定离线
  const MAX_HIST  = 200;    // 本地保留的历史消息条数

  /* ---------------- 工具 ---------------- */
  const $ = id => document.getElementById(id);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const pad = n => String(n).padStart(2, '0');
  const fmtTime = ts => {
    const d = new Date(ts);
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  function colorOf(str) {
    let h = 0;
    str = String(str || '?');
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
    return `hsl(${h}, 62%, 55%)`;
  }

  function normRoom(s) {
    return (s || '').replace(/[\/+#\s]/g, '_').replace(/^_+|_+$/g, '').slice(0, 24);
  }

  /* ---------------- 身份 ---------------- */
  const SS_ID   = 'chat_uid_v1';
  const SS_NAME = 'chat_name_v1';

  let myId = sessionStorage.getItem(SS_ID);
  if (!myId) {
    myId = 'u' + Math.random().toString(36).slice(2, 10);
    sessionStorage.setItem(SS_ID, myId);
  }

  let myName = sessionStorage.getItem(SS_NAME) || '';
  let room   = '';

  // 从 URL 读取房间名
  const params = new URLSearchParams(location.search);
  room = normRoom(params.get('room')) || 'lobby';

  const topicMsg      = PREFIX + room + '/msg';
  const topicPresence = PREFIX + room + '/presence';

  /* ---------------- 元素 ---------------- */
  const chatBody   = $('chatBody');
  const input      = $('input');
  const sendBtn    = $('sendBtn');
  const clearBtn   = $('clearBtn');
  const nameBtn    = $('nameBtn');
  const inviteBtn  = $('inviteBtn');
  const roomTitle  = $('roomTitle');
  const statusDot  = $('statusDot');
  const statusText = $('statusText');
  const overlay    = $('overlay');
  const modalTitle = $('modalTitle');
  const modalDesc  = $('modalDesc');
  const modalBody  = $('modalBody');
  const modalOk    = $('modalOk');
  const modalCancel= $('modalCancel');

  roomTitle.textContent = '房间：' + room;

  /* ---------------- 状态 ---------------- */
  let client = null;
  let ready  = false;
  const rendered = new Set();
  const peers = new Map();     // uid -> { name, last }
  let hbTimer = null;

  /* ---------------- 历史（仅本地，用于刷新后恢复） ---------------- */
  const histKey = 'chat_hist_' + room;
  function loadHistory() {
    try { return JSON.parse(sessionStorage.getItem(histKey)) || []; }
    catch { return []; }
  }
  function pushHistory(m) {
    const list = loadHistory();
    list.push(m);
    try {
      sessionStorage.setItem(histKey, JSON.stringify(list.slice(-MAX_HIST)));
    } catch (e) { /* 存储满忽略 */ }
  }

  /* ---------------- 渲染 ---------------- */
  function scrollToBottom() {
    requestAnimationFrame(() => { chatBody.scrollTop = chatBody.scrollHeight; });
  }

  function addSystem(text) {
    const el = document.createElement('div');
    el.className = 'system';
    el.textContent = text;
    chatBody.appendChild(el);
    scrollToBottom();
  }

  function renderMessage(m, animate = true) {
    if (!m || rendered.has(m.id)) return;
    rendered.add(m.id);

    const mine = m.uid === myId;

    const el = document.createElement('div');
    el.className = 'msg ' + (mine ? 'me' : 'other');
    if (!animate) el.style.animation = 'none';

    const av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = (m.name || '?').trim().charAt(0).toUpperCase();
    if (!mine) av.style.background = colorOf(m.uid || m.name);

    const wrap = document.createElement('div');
    wrap.className = 'wrap';

    if (!mine) {
      const nm = document.createElement('div');
      nm.className = 'name';
      nm.textContent = m.name;
      wrap.appendChild(nm);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = m.text;      // textContent 天然防 XSS

    const time = document.createElement('div');
    time.className = 'time';
    time.textContent = fmtTime(m.ts);

    wrap.append(bubble, time);
    el.append(av, wrap);
    chatBody.appendChild(el);
    if (animate) scrollToBottom();
  }

  /* ---------------- 在线状态 ---------------- */
  function renderOnline() {
    const n = peers.size + (ready ? 1 : 0);
    statusText.textContent = ready ? (n + ' 人在线') : statusText.textContent;
    if (ready) {
      const names = [myName, ...[...peers.values()].map(p => p.name)];
      statusText.title = names.join('、');
    }
  }

  function publishPresence(type) {
    if (!client || !ready || !myName) return;
    client.publish(topicPresence, JSON.stringify({
      type: type || 'presence', uid: myId, name: myName
    }), { qos: 0 });
  }

  function startHeartbeat() {
    if (hbTimer) return;
    publishPresence('hello');   // 先打招呼，让其他人回我
    hbTimer = setInterval(() => {
      publishPresence('presence');
      // 清理超时的
      const now = Date.now();
      let changed = false;
      peers.forEach((p, id) => {
        if (now - p.last > PEER_TTL) { peers.delete(id); changed = true; }
      });
      if (changed) renderOnline();
    }, HEARTBEAT);
  }

  /* ---------------- MQTT 连接 ---------------- */
  function setStatus(cls, txt) {
    statusDot.className = 'dot ' + cls;
    statusText.textContent = txt;
  }

  function connectBroker() {
    setStatus('', '连接中…');

    client = mqtt.connect(BROKER, {
      clientId: 'ghc_' + myId + Math.random().toString(16).slice(2, 6),
      clean: true,
      keepalive: 30,
      reconnectPeriod: 3000,
      connectTimeout: 12000,
    });

    client.on('connect', () => {
      ready = true;
      setStatus('on', '已连接');
      client.subscribe([topicMsg, topicPresence], { qos: 0 }, err => {
        if (err) console.warn('订阅失败', err);
        startHeartbeat();
        renderOnline();
      });
    });

    client.on('reconnect', () => setStatus('', '重连中…'));

    client.on('close', () => {
      if (ready) addSystem('连接已断开，正在尝试重连…');
      ready = false;
      setStatus('off', '已断开');
      updateSendState();
    });

    client.on('error', e => console.warn('MQTT 错误', e));

    client.on('message', onMessage);
  }

  function onMessage(topic, payload) {
    let data;
    try { data = JSON.parse(payload.toString()); }
    catch { return; }

    /* --- 聊天消息 --- */
    if (topic === topicMsg) {
      if (!data || data.uid === myId) return;   // 自己发的本地已渲染
      pushHistory(data);
      renderMessage(data);
      return;
    }

    /* --- 在线状态 --- */
    if (topic === topicPresence) {
      if (!data || !data.uid || data.uid === myId) return;

      peers.set(data.uid, { name: data.name || '匿名', last: Date.now() });
      renderOnline();

      // 有人新进来打招呼，我立刻回应一下
      if (data.type === 'hello') publishPresence('presence');
    }
  }

  /* ---------------- 发送 ---------------- */
  function send() {
    const text = input.value.trim();
    if (!text || !ready || !myName) return;

    const msg = { id: uid(), uid: myId, name: myName, text, ts: Date.now() };

    client.publish(topicMsg, JSON.stringify(msg), { qos: 0 });
    pushHistory(msg);
    renderMessage(msg);

    input.value = '';
    autoResize();
    updateSendState();
  }

  /* ---------------- 输入框 ---------------- */
  function autoResize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 108) + 'px';
  }
  function updateSendState() {
    sendBtn.disabled = !input.value.trim() || !ready;
  }

  input.addEventListener('input', () => { autoResize(); updateSendState(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  sendBtn.addEventListener('click', send);

  /* ---------------- 弹窗控制 ---------------- */
  function openModal(opts) {
    modalTitle.textContent = opts.title;
    modalDesc.textContent  = opts.desc || '';
    modalDesc.style.display = opts.desc ? '' : 'none';
    modalBody.innerHTML = opts.html || '';
    modalOk.textContent = opts.okText || '确定';
    modalCancel.style.display = opts.onCancel ? '' : 'none';
    overlay.classList.add('show');

    modalOk.onclick = () => {
      const ok = opts.onOk && opts.onOk();
      if (ok !== false) closeModal();
    };
    modalCancel.onclick = () => { closeModal(); opts.onCancel && opts.onCancel(); };

    if (opts.focus) setTimeout(() => $(opts.focus)?.focus(), 60);
  }
  function closeModal() { overlay.classList.remove('show'); }

  /* ---------------- 昵称设置 ---------------- */
  function askName(isFirst) {
    openModal({
      title: isFirst ? '加入聊天室' : '修改昵称',
      desc: isFirst ? '输入一个昵称，就可以开始聊天了' : '换一个昵称吧',
      html: `<input id="f_name" maxlength="12" placeholder="你的昵称" value="${(sessionStorage.getItem(SS_NAME) || '').replace(/"/g, '&quot;')}">`,
      okText: isFirst ? '开始聊天' : '保存',
      focus: 'f_name',
      onOk: () => {
        const v = $('f_name').value.trim();
        if (!v) { $('f_name').focus(); return false; }

        const old = myName;
        myName = v;
        sessionStorage.setItem(SS_NAME, v);

        if (!client) {
          connectBroker();
        } else if (ready) {
          peers.clear();
          publishPresence('hello');
          renderOnline();
        }

        if (isFirst) {
          addSystem(`你已加入「${room}」，昵称：${v}`);
        } else if (old !== v) {
          addSystem(`昵称已改为：${v}`);
          if (ready) client.publish(topicMsg, JSON.stringify({
            id: uid(), uid: myId, name: v, text: `（${old} 改名为 ${v}）`, ts: Date.now()
          }), { qos: 0 });
        }
        updateSendState();
      }
    });
  }

  nameBtn.addEventListener('click', () => askName(false));

  /* ---------------- 邀请 ---------------- */
  inviteBtn.addEventListener('click', () => {
    const url = location.origin + location.pathname + '?room=' + encodeURIComponent(room);

    openModal({
      title: '邀请朋友加入',
      desc: '把下面的链接发给对方，打开就能进同一个房间',
      html: `<div class="link-box" id="f_link">${url}</div>`,
      okText: '复制链接',
      onOk: () => {
        const done = () => addSystem('邀请链接已复制，快发给朋友吧～');
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(url).then(done, () => fallbackCopy(url, done));
        } else {
          fallbackCopy(url, done);
        }
      }
    });
  });

  function fallbackCopy(text, cb) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); cb(); } catch (e) { alert('复制失败，请手动复制：\n' + text); }
    ta.remove();
  }

  /* ---------------- 清屏 ---------------- */
  clearBtn.addEventListener('click', () => {
    if (!confirm('清空本机聊天记录？（只影响你自己）')) return;
    rendered.clear();
    chatBody.innerHTML = '';
    sessionStorage.removeItem(histKey);
    addSystem('聊天记录已清空');
  });

  /* ---------------- 离开 ---------------- */
  window.addEventListener('beforeunload', () => {
    if (client && ready) {
      client.publish(topicPresence, JSON.stringify({ type: 'leave', uid: myId, name: myName }));
    }
  });

  /* ---------------- 启动 ---------------- */
  function init() {
    const hist = loadHistory();
    if (hist.length) {
      hist.forEach(m => renderMessage(m, false));
      scrollToBottom();
    } else {
      addSystem('欢迎来到「' + room + '」聊天室');
    }

    if (myName) {
      connectBroker();
    } else {
      askName(true);
    }
    updateSendState();
  }

  init();
};
</script>
</body>
</html>
